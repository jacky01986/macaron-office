<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎯 自動回覆流程 · 溫點 WarmPlace</title>
<style>
:root{--burgundy:#6D2E46;--burgundy-d:#4A1D2E;--gold:#B08D57;--ivory:#FCF6F5;--dark:#1C1213;--dark2:#241619;--dark3:#2E1A1F;--green:#3FB27F;--muted:#9A8790}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei",-apple-system,sans-serif;background:var(--dark);color:var(--ivory);line-height:1.55;padding:18px 14px;max-width:960px;margin:0 auto}
a{color:var(--gold);text-decoration:none}
h1{font-size:22px;color:var(--gold);margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--burgundy);background:var(--dark3);color:var(--ivory);padding:7px 13px;font-size:13px}
button.primary{background:linear-gradient(90deg,var(--burgundy),var(--burgundy-d));border-color:var(--gold);color:var(--gold);font-weight:700}
button.danger{border-color:#7a2130;color:#e88}
button.mini{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow{background:var(--dark2);border:1px solid var(--burgundy-d);border-radius:10px;padding:11px 13px;margin-bottom:9px;display:flex;gap:10px;align-items:center}
.flow .info{flex:1}.flow .nm{font-weight:700}.flow .meta{color:var(--muted);font-size:12px;margin-top:2px}
.pill{display:inline-block;background:var(--dark3);border:1px solid var(--burgundy);color:var(--gold);border-radius:12px;font-size:11px;padding:1px 8px;margin-right:4px}
.off{opacity:.5}
label{display:block;font-size:12px;color:var(--muted);margin:9px 0 3px}
input,select,textarea{width:100%;background:var(--dark3);border:1px solid var(--burgundy-d);color:var(--ivory);border-radius:7px;padding:7px;font-family:inherit;font-size:13px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--dark2);border:1px solid var(--gold);border-radius:12px;padding:15px 16px;margin-top:12px}
.node{background:var(--dark3);border:1px solid var(--burgundy-d);border-radius:9px;padding:11px;margin:9px 0}
.node.start{border-color:var(--gold)}
.node .hd{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.node .tag{font-weight:700;color:var(--gold)}
.btnrow{display:flex;gap:6px;align-items:center;margin-top:5px}
.btnrow input{flex:1}.btnrow select{width:150px}
.sim{background:#100e0d;border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:12px}
.chat{margin-top:8px}
.bubble{background:var(--burgundy);color:var(--ivory);border-radius:14px 14px 14px 3px;padding:8px 12px;margin:6px 0;max-width:82%;font-size:13px;white-space:pre-wrap}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.qbtn{background:var(--dark3);border:1px solid var(--gold);color:var(--gold);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer}
.me{background:var(--dark3);color:var(--ivory);border-radius:14px 14px 3px 14px;margin-left:auto;max-width:82%;padding:6px 11px;font-size:13px}
.hidden{display:none}
.toast{position:fixed;top:14px;right:14px;background:var(--green);color:#04240f;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:.3s}
.toast.show{opacity:1}
</style></head><body>
<div class="toast" id="toast">✓ 已存</div>
<a href="/">← 返回辦公室</a>
<h1>🎯 自動回覆流程</h1>
<div class="sub">關鍵字觸發 → 訊息＋按鈕分支（按按鈕跳到對應節點）。FB Messenger / Instagram 私訊。附可點擊模擬器。</div>
<div class="row"><button class="primary" onclick="newFlow()">➕ 新增流程</button><button class="mini" onclick="loadList()">🔄 重新載入</button></div>
<div class="panel" id="cfgPanel" style="border-color:var(--burgundy-d);margin-top:12px"><strong>⚙️ 智慧回覆（客人私訊「沒中任何關鍵字」時怎麼辦）</strong><label>處理方式</label><select id="cfg_mode" onchange="cfgModeChange()"><option value="off">不回覆</option><option value="text">回一則固定訊息</option><option value="ai">交給 AI 客服自動回答（有問必答）</option></select><div id="cfg_textwrap" class="hidden"><label>固定回覆內容</label><textarea id="cfg_text" placeholder="例：感謝您的訊息 🥐 稍後將由專人為您服務，也可先逛官網 www.warmplacehere.com"></textarea></div><div class="row" style="margin-top:8px"><button class="primary" onclick="saveCfg()">💾 儲存智慧回覆設定</button></div></div>
<div id="list" style="margin-top:12px">載入中…</div>
<div id="editor" class="panel hidden"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const toast=()=>{const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let FLOWS=[],cur=null;
async function loadList(){try{const r=await fetch('/api/flows');const j=await r.json();FLOWS=j.flows||[];renderList();}catch(e){$('#list').innerHTML='<div style="color:#e88">載入失敗：'+e.message+'</div>';}}
function renderList(){
  if(!FLOWS.length){$('#list').innerHTML='<div style="color:var(--muted)">還沒有流程。按「➕ 新增流程」建立第一個。</div>';return;}
  $('#list').innerHTML=FLOWS.map(f=>{const nc=Object.keys(f.nodes||{}).length;return '<div class="flow'+(f.enabled?'':' off')+'">'
    +'<div class="info"><div class="nm">'+esc(f.name)+'</div><div class="meta"><span class="pill">'+(f.platform==='instagram'?'📸 IG':'💬 Messenger')+'</span>'+(f.category?'<span class="pill">'+esc(f.category)+'</span>':'')+'關鍵字：'+esc((f.keywords||[]).join('、')||'（無）')+' · '+nc+' 節點 · 冷卻 '+(f.cooldownHours||0)+'h · '+(f.enabled?'✅ 啟用':'⏸ 停用')+'</div></div>'
    +'<button class="mini" onclick="editFlow(\''+f.id+'\')">編輯</button><button class="mini" onclick="cloneFlow(\''+f.id+'\')">⧉ 複製</button><button class="mini danger" onclick="delFlow(\''+f.id+'\')">刪</button></div>';}).join('');
}
function newFlow(){cur={id:'',name:'',platform:'messenger',category:'',keywords:[],cooldownHours:24,enabled:true,startNode:'n1',nodes:{n1:{text:'',buttons:[]}}};renderEditor();renderTree();try{document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}}
function editFlow(id){cur=JSON.parse(JSON.stringify(FLOWS.find(f=>f.id===id)));if(!cur.nodes||!Object.keys(cur.nodes).length){cur.nodes={n1:{text:'',buttons:[]}};cur.startNode='n1';}renderEditor();renderTree();try{document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}}
async function delFlow(id){if(!confirm('確定刪除這個流程？'))return;await fetch('/api/flows/'+id,{method:'DELETE'});loadList();}
function nodeIds(){return Object.keys(cur.nodes);}
function nextNodeName(){let i=1;while(cur.nodes['n'+i])i++;return 'n'+i;}
function nodeOptions(sel){return '<option value="">（結束對話）</option>'+nodeIds().map(id=>'<option value="'+id+'"'+(id===sel?' selected':'')+'>'+id+(cur.nodes[id].label?'｜'+esc(cur.nodes[id].label):'')+'：'+esc((cur.nodes[id].text||'').slice(0,12))+'</option>').join('');}
function renderNodes(){
  return nodeIds().map(id=>{const n=cur.nodes[id];const isStart=cur.startNode===id;
    return '<div class="node'+(isStart?' start':'')+'"><div class="hd"><span class="tag">'+id+(n.label?'｜'+esc(n.label):'')+(isStart?' ⭐起點':'')+'</span>'
      +(isStart?'':'<button class="mini" onclick="setStart(\''+id+'\')">設為起點</button>')
      +'<button class="mini" onclick="dupNode(\''+id+'\')">⧉ 複製</button>'
      +(nodeIds().length>1?'<button class="mini danger" onclick="delNode(\''+id+'\')">刪</button>':'')+'</div>'
      +'<input placeholder="節點名稱（例：起點/門店/線上）" value="'+esc(n.label||'')+'" oninput="cur.nodes[\''+id+'\'].label=this.value" style="margin-bottom:6px">'
      +'<input placeholder="🖼 圖片網址（可留空）" value="'+esc(n.image||'')+'" oninput="cur.nodes[\''+id+'\'].image=this.value" style="margin-bottom:6px">'
      +'<textarea placeholder="這個節點要回覆的訊息" oninput="cur.nodes[\''+id+'\'].text=this.value">'+esc(n.text)+'</textarea>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:6px">按鈕（客人按了跳到指定節點）：</div>'
      +(n.buttons||[]).map((b,i)=>{var isUrl=!!b.url;return '<div class="btnrow"><input placeholder="按鈕文字" value="'+esc(b.label)+'" oninput="cur.nodes[\''+id+'\'].buttons['+i+'].label=this.value"><select onchange="setBtnType(\''+id+'\','+i+',this.value)" style="width:82px"><option value="next"'+(isUrl?'':' selected')+'>跳節點</option><option value="url"'+(isUrl?' selected':'')+'>開連結</option></select>'+(isUrl?'<input placeholder="https://連結網址" value="'+esc(b.url)+'" oninput="cur.nodes[\''+id+'\'].buttons['+i+'].url=this.value">':'<select onchange="cur.nodes[\''+id+'\'].buttons['+i+'].next=this.value">'+nodeOptions(b.next)+'</select>')+'<button class="mini danger" onclick="delBtn(\''+id+'\','+i+')">✕</button></div>';}).join('')+'<button class="mini" style="margin-top:6px" onclick="addBtn(\''+id+'\')">➕ 加按鈕</button></div>';
  }).join('');
}
function renderEditor(){
  const f=cur;const e=$('#editor');e.classList.remove('hidden');
  e.innerHTML='<h3 style="margin-top:0;color:var(--gold)">'+(f.id?'編輯流程':'新增流程')+'</h3>'
    +'<label>流程名稱</label><input id="f_name" value="'+esc(f.name)+'">'
    +'<div class="grid2"><div><label>平台</label><select id="f_platform"><option value="messenger"'+(f.platform==='messenger'?' selected':'')+'>💬 Messenger</option><option value="instagram"'+(f.platform==='instagram'?' selected':'')+'>📸 Instagram</option></select></div><div><label>分類（可留空）</label><input id="f_category" value="'+esc(f.category)+'"></div></div>'
    +'<label>觸發關鍵字（逗號或空格分隔）</label><input id="f_kw" value="'+esc((f.keywords||[]).join('、'))+'">'
    +'<div class="grid2"><div><label>冷卻（小時）</label><input id="f_cd" type="number" value="'+(f.cooldownHours||0)+'"></div><div style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:8px;margin:0"><input type="checkbox" id="f_enabled" '+(f.enabled?'checked':'')+' style="width:auto">啟用此流程</label></div></div>'
    +'<h4 style="margin:16px 0 4px">🌳 節點與分支</h4><div id="nodes">'+renderNodes()+'</div><button class="mini" onclick="addNode()">➕ 加節點</button>'
    +'<div class="sim"><strong>🧪 模擬器（可點按鈕）</strong><label>模擬客人第一句話（含關鍵字才會觸發）</label><div class="row"><input id="sim_in" placeholder="例：杜拜巧克力" style="flex:1"><button onclick="simStart()">▶️ 開始</button></div><div class="chat" id="sim_chat"></div></div>'
    +'<div class="row" style="margin-top:14px"><button class="primary" onclick="saveFlow()">💾 儲存</button><button onclick="closeEditor()">取消</button></div>';
}
function setStart(id){cur.startNode=id;renderNodes2();}
function addNode(){collect();const id=nextNodeName();cur.nodes[id]={text:'',buttons:[]};renderNodes2();}
function delNode(id){collect();delete cur.nodes[id];nodeIds().forEach(k=>cur.nodes[k].buttons=(cur.nodes[k].buttons||[]).map(b=>({label:b.label,next:b.next===id?'':b.next})));if(cur.startNode===id)cur.startNode=nodeIds()[0]||'n1';renderNodes2();}
function addBtn(id){collect();cur.nodes[id].buttons=cur.nodes[id].buttons||[];cur.nodes[id].buttons.push({label:'',next:''});renderNodes2();}
function delBtn(id,i){collect();cur.nodes[id].buttons.splice(i,1);renderNodes2();}
function setBtnType(id,i,t){collect();var b=cur.nodes[id].buttons[i];if(t==='url'){b.url=b.url||'';delete b.next;}else{b.next=b.next||'';delete b.url;}renderNodes2();}
function dupNode(id){collect();var nid=nextNodeName();cur.nodes[nid]=JSON.parse(JSON.stringify(cur.nodes[id]));if(cur.nodes[nid].label)cur.nodes[nid].label=cur.nodes[nid].label+'複本';renderNodes2();}
async function cloneFlow(id){var src=FLOWS.find(function(f){return f.id===id;});if(!src)return;var other=src.platform==='messenger'?'instagram':'messenger';var toOther=confirm('要複製成另一平台（'+(other==='instagram'?'IG':'Messenger')+'）版嗎？\n\n確定 = 複製為另一平台版\n取消 = 複製為同平台副本');var clone=JSON.parse(JSON.stringify(src));clone.id='';if(toOther){clone.platform=other;clone.name=src.name.replace(/ (FB|IG)$/,'')+(other==='instagram'?' IG':' FB');}else{clone.name=src.name+' (複製)';}var r=await fetch('/api/flows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(clone)});var j=await r.json();if(j.ok){toast();loadList();}else alert('複製失敗');}
function renderNodes2(){$('#nodes').innerHTML=renderNodes();renderTree();}
function renderTree(){if(!cur)return;var e=document.getElementById('editor');if(!e)return;var el=document.getElementById('treeprev');if(!el){el=document.createElement('div');el.id='treeprev';el.style.marginTop='10px';e.appendChild(el);}var ids=Object.keys(cur.nodes);var h='<div style="font-size:12px;color:var(--muted);margin:8px 0 4px">🌳 流程圖預覽（節點 → 按鈕去向）</div>';h+=ids.map(function(id){var n=cur.nodes[id];var isS=cur.startNode===id;var bs=(n.buttons||[]).filter(function(b){return b&&b.label;});var head='<div style="margin:4px 0;padding:6px 10px;background:var(--dark3);border-left:3px solid '+(isS?'var(--gold)':'var(--burgundy)')+';border-radius:4px"><b>'+esc(id)+(n.label?'｜'+esc(n.label):'')+(isS?' ⭐起點':'')+'</b>';var arrows=bs.map(function(b){var tgt=b.url?'🔗 開連結':(b.next?(esc(b.next)+(cur.nodes[b.next]&&cur.nodes[b.next].label?'（'+esc(cur.nodes[b.next].label)+'）':'')):'（結束對話）');return '<div style="margin-left:14px;font-size:12px;color:var(--gold)">└ ['+esc(b.label)+'] → '+tgt+'</div>';}).join('');return head+arrows+'</div>';}).join('');el.innerHTML=h;}
function collect(){if(!$('#f_name'))return;cur.name=$('#f_name').value;cur.platform=$('#f_platform').value;cur.category=$('#f_category').value;cur.cooldownHours=Number($('#f_cd').value)||0;cur.keywords=$('#f_kw').value.split(/[,\s，、]+/).map(s=>s.trim()).filter(Boolean);cur.enabled=$('#f_enabled').checked;}
async function saveFlow(){collect();if(!cur.name){alert('請填流程名稱');return;}if(!cur.keywords.length){alert('請至少填一個觸發關鍵字');return;}
  const r=await fetch('/api/flows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cur)});const j=await r.json();
  if(j.ok){toast();closeEditor();loadList();}else alert('儲存失敗：'+(j.error||''));}
function closeEditor(){$('#editor').classList.add('hidden');cur=null;}
async function simCall(payload){const r=await fetch('/api/flows/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json();}
async function simStart(){collect();const input=$('#sim_in').value;$('#sim_chat').innerHTML='<div class="me">'+esc(input)+'</div>';
  const j=await simCall({flow:cur,input});
  if(!j.matched){$('#sim_chat').innerHTML+='<div style="color:var(--muted);font-size:12px">⚠️ 這句不含關鍵字，不會觸發</div>';return;}
  renderSimNode(j);}
async function simGo(nextId,label){$('#sim_chat').innerHTML+='<div class="me">'+esc(label)+'</div>';
  if(!nextId){$('#sim_chat').innerHTML+='<div style="color:var(--muted);font-size:12px">（對話結束）</div>';return;}
  const j=await simCall({flow:cur,nodeId:nextId});renderSimNode(j);}
function renderSimNode(j){const c=$('#sim_chat');let h='<div class="bubble">'+esc(j.text||'')+'</div>';
  if(j.buttons&&j.buttons.length){h+='<div class="qbtns">'+j.buttons.map((b,i)=>b.url?'<a class="qbtn" href="'+esc(b.url)+'" target="_blank">'+esc(b.label)+' 🔗</a>':'<span class="qbtn" data-next="'+esc(b.next)+'" data-label="'+esc(b.label)+'">'+esc(b.label)+'</span>').join('')+'</div>';}
  c.insertAdjacentHTML('beforeend',h);
  [...c.querySelectorAll('span.qbtn')].forEach(el=>{el.onclick=()=>{const n=el.getAttribute('data-next');const l=el.getAttribute('data-label');[...c.querySelectorAll('.qbtn')].forEach(x=>x.style.pointerEvents='none');simGo(n,l);};});
  c.scrollTop=c.scrollHeight;}
async function loadCfg(){try{var r=await fetch('/api/flows/config');var j=await r.json();var c=j.config||{};document.getElementById('cfg_mode').value=c.fallback||'off';document.getElementById('cfg_text').value=c.fallbackText||'';cfgModeChange();}catch(e){}}
function cfgModeChange(){var m=document.getElementById('cfg_mode').value;document.getElementById('cfg_textwrap').classList.toggle('hidden',m!=='text');}
async function saveCfg(){var body={fallback:document.getElementById('cfg_mode').value,fallbackText:document.getElementById('cfg_text').value};var r=await fetch('/api/flows/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var j=await r.json();if(j.ok)toast();}
loadCfg();
loadList();
</script>
</body></html>
